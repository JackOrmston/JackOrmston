name: Refresh profile graphics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_stats.py
      - name: Commit changed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/technologies.svg assets/stats/languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public portfolio graphics"
          git push
